name: i016-pkg-pub-publish
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: version to publish
        required: true
        default: '1.0.1'
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - name: prepare
        run: |
          V="${{ inputs.version || '1.0.0' }}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2))" "$V"
          printf 'marker i016-pub version %s ts %s\n' "$V" "$(date +%s%3N)" > marker-i016.txt
          echo "== package.json =="
          cat package.json
          echo "== marker =="
          cat marker-i016.txt
      - name: npm publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

