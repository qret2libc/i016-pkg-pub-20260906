name: i016-del-container-pub
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  del:
    runs-on: ubuntu-latest
    steps:
      - name: del-container-version
        run: |
          code=$(curl -sS -o /tmp/del.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/user/packages/container/i016-pkg-pub-20260906/versions/1215762237")
          echo "I016DELCONTAINER -> $code"
          head -c 800 /tmp/del.json
